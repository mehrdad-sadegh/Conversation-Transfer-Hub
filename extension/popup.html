<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation Transfer Hub</title>
<style>
  :root{
    --bg:#f5f7f8;--surface:#fff;--surface-2:#eceff3;--surface-3:#e3e7ec;
    --fg:#171a20;--muted:#5c626e;--border:#d9dee5;
    --accent:#0d9488;--accent-fg:#fff;--accent-soft:#d6f2ee;
    --ok:#15803d;--no:#c0362c;--warn:#b45309;
    --font:'Segoe UI',Tahoma,system-ui,sans-serif;--mono:'Cascadia Code',Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0d1015;--surface:#161b22;--surface-2:#1b222b;--surface-3:#232c37;
    --fg:#e7ebf1;--muted:#98a2b1;--border:#2a323d;
    --accent:#2dd4bf;--accent-fg:#052823;--accent-soft:#123833;
    --ok:#4ade80;--no:#f87171;--warn:#fbbf24;color-scheme:dark;
  }}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:390px;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13.5px;line-height:1.5}
  .pad{padding:14px}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
  .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:var(--accent-fg);flex:none}
  .logo svg{width:17px;height:17px}
  header h1{font-size:14px;margin:0;font-weight:700;flex:1;min-width:0}
  .toggle{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--fg)}
  .status{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:12px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .stat{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;flex:1;min-width:64px;text-align:center}
  .stat b{display:block;font-family:var(--mono);font-size:16px}
  .stat span{font-size:10.5px;color:var(--muted)}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
  select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 9px;color:var(--fg);font-family:inherit;font-size:13px}
  textarea{width:100%;height:150px;resize:vertical;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--fg);white-space:pre-wrap}
  .row{display:flex;gap:8px;margin-top:10px}
  button.act{flex:1;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:9px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  button.sec{background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
  button.act:hover{filter:brightness(1.06)}
  .note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
  .empty{background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:18px 14px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
  .empty strong{color:var(--fg);display:block;margin-bottom:4px}
  code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 4px;font-size:11px}
  .srcbadge{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 8px;background:var(--surface-2)}
  .srcbadge.ai{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  details#aiBox{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:10px}
  details#aiBox>summary{cursor:pointer;font-weight:700;font-size:12.5px;list-style:none}
  details#aiBox>summary::-webkit-details-marker{display:none}
  details#aiBox>summary::before{content:"▸";margin-inline-end:6px;color:var(--accent)}
  details#aiBox[open]>summary::before{content:"▾"}
  .aibody{margin-top:8px}
  .aibody input,.aibody select{font-size:12.5px;padding:7px 8px}
  .appfoot{border-top:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);direction:ltr}
  .appfoot b{color:var(--fg)}
  .tglink{display:inline-flex;align-items:center;gap:5px;color:var(--accent);text-decoration:none;font-weight:700;font-family:var(--mono);font-size:11.5px}
  .tglink:hover{text-decoration:underline}
  .tglink svg{width:14px;height:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11"/><path d="m12 4 3 3-3 3"/><path d="M20 17H9"/><path d="m12 20-3-3 3-3"/></svg></span>
  <h1 id="title">هاب انتقال مکالمه</h1>
  <button class="toggle" id="rereadBtn" title="Re-read the page">↻</button>
  <button class="toggle" id="langBtn">EN</button>
</header>

<div class="pad">
  <!-- empty / error state -->
  <div class="empty" id="emptyState" hidden>
    <strong id="emptyTitle"></strong>
    <span id="emptyMsg"></span>
  </div>

  <!-- main -->
  <div id="main" hidden>
    <div class="status">
      <span class="pill"><span class="dot"></span><span id="providerName"></span></span>
      <span id="detectedTxt" style="color:var(--muted)"></span>
      <span id="ctxSrc" class="srcbadge"></span>
    </div>

    <div class="stats" id="stats"></div>

    <div class="field">
      <label id="lblTo">به (مقصد)</label>
      <select id="toSel"></select>
    </div>
    <div class="field">
      <label id="lblMode">حالت انتقال</label>
      <select id="modeSel"></select>
    </div>

    <details id="aiBox">
      <summary id="aiSummary"></summary>
      <div class="aibody">
        <div class="field"><label id="lblAiProvider"></label>
          <select id="aiProvider">
            <option value="claude">Claude (Anthropic)</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini (Google)</option>
          </select>
        </div>
        <div class="field"><label id="lblAiModel"></label><input id="aiModel" type="text" spellcheck="false"></div>
        <div class="field"><label id="lblAiKey"></label><input id="aiKey" type="password" autocomplete="off" spellcheck="false"></div>
        <div class="note" id="aiConsent"></div>
        <button class="act" id="aiRun" style="width:100%;margin-top:6px"></button>
        <div class="note" id="aiStatus"></div>
      </div>
    </details>

    <div class="field">
      <label id="lblOut">خروجی آماده برای Paste</label>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </div>

    <div class="row">
      <button class="act" id="copyBtn"></button>
      <button class="act sec" id="dlMd"></button>
      <button class="act sec" id="dlJson"></button>
    </div>

    <div class="note" id="note"></div>
  </div>

  <div class="appfoot">
    <span>Developer: <b>Mehrdad Sadegh</b></span>
    <a href="https://t.me/softserv_ir" target="_blank" rel="noopener" class="tglink" title="Open our Telegram channel">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.4 13.2 1.6 11.7c-1-.3-1-1 .2-1.5L20.6 2.9c.9-.3 1.6.2 1.3 1.4z"/></svg>
      @softserv_ir
    </a>
  </div>
</div>

<script src="core.js"></script>
<script src="popup.js"></script>
</body>
</html>
